[workspace]
resolver = "2"
members = [
    "vela-proto",
    "vela-crypto",
    "vela-stun",
    "vela-coord-client",
    "vela-core",
    "vela-coord",
    "vela-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
rand_core = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
